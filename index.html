<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>웹앱 아카이브</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="./" class="brand">
        <span class="brand-mark" id="brandMark">웹</span>
        <span class="brand-name" id="brandName">웹앱 아카이브</span>
      </a>
      <div class="topbar-right">
        <nav class="nav" id="nav"></nav>
        <button class="qr-btn" id="qrBtn" type="button" aria-label="휴대폰으로 접속하는 QR 코드 크게 보기">
          <img src="images/qr.svg" alt="" width="40" height="40" />
          <span>QR<br />접속</span>
        </button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="wrap hero-inner">
      <div class="hero-text">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="siteTitle"></h1>
        <p class="intro" id="intro"></p>
        <form class="search" id="searchForm" role="search">
          <label class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="searchInput" type="search" placeholder="앱 이름, 과목, 단원, 키워드로 찾기" autocomplete="off" />
          </label>
          <button type="submit">검색</button>
        </form>
      </div>
      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 360 220">
          <defs>
            <radialGradient id="glow" cx="50%" cy="50%" r="55%">
              <stop offset="0%" stop-color="#fff6df"/><stop offset="100%" stop-color="#fff6df" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <ellipse cx="180" cy="110" rx="178" ry="108" fill="url(#glow)"/>
          <!-- 칠판 -->
          <rect x="70" y="28" width="220" height="104" rx="8" fill="#2f5446"/>
          <rect x="70" y="28" width="220" height="104" rx="8" fill="none" stroke="#b9895a" stroke-width="7"/>
          <path d="M96 62h70M96 80h104M96 98h56" stroke="#e9f1ea" stroke-width="4" stroke-linecap="round" opacity=".85"/>
          <circle cx="242" cy="78" r="22" fill="none" stroke="#f4d78a" stroke-width="4"/>
          <path d="M232 78l7 7 13-14" fill="none" stroke="#f4d78a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- 책상 -->
          <rect x="40" y="160" width="280" height="14" rx="7" fill="#c99a68"/>
          <rect x="62" y="174" width="10" height="34" fill="#a97b4f"/><rect x="288" y="174" width="10" height="34" fill="#a97b4f"/>
          <!-- 노트북 -->
          <path d="M128 110h104a6 6 0 0 1 6 6v40H122v-40a6 6 0 0 1 6-6z" fill="#3b3f46"/>
          <rect x="130" y="118" width="100" height="36" rx="3" fill="#cfe6d8"/>
          <rect x="138" y="125" width="26" height="22" rx="3" fill="#7fae95"/>
          <rect x="168" y="125" width="26" height="22" rx="3" fill="#e9b872"/>
          <rect x="198" y="125" width="24" height="22" rx="3" fill="#c9826b"/>
          <path d="M108 156h144l-8 6H116z" fill="#5a5f68"/>
          <!-- 책, 컵, 화분 -->
          <rect x="60" y="140" width="46" height="9" rx="2" fill="#d36b4f"/>
          <rect x="64" y="131" width="40" height="9" rx="2" fill="#4f7f6b"/>
          <rect x="58" y="149" width="50" height="11" rx="2" fill="#e5b45c"/>
          <rect x="262" y="134" width="22" height="26" rx="4" fill="#f2efe8"/>
          <path d="M284 140a7 7 0 0 1 0 12" fill="none" stroke="#f2efe8" stroke-width="4"/>
          <path d="M300 160v-18" stroke="#4f7f6b" stroke-width="3"/>
          <ellipse cx="294" cy="142" rx="8" ry="4" fill="#6ea37f" transform="rotate(-30 294 142)"/>
          <ellipse cx="306" cy="146" rx="8" ry="4" fill="#6ea37f" transform="rotate(30 306 146)"/>
          <!-- 반짝이 -->
          <path d="M320 40l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#e9b872"/>
          <path d="M40 70l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#7fae95"/>
        </svg>
      </div>
    </div>
  </section>

  <main class="wrap" id="main"></main>

  <section class="wrap guide" id="guide">
    <h2>이용안내</h2>
    <div class="guide-grid">
      <div class="guide-card"><strong>1. 둘러보기</strong><p>카드를 누르면 웹앱이 새 탭에서 열립니다. 로그인 없이 바로 쓸 수 있어요.</p></div>
      <div class="guide-card"><strong>2. 찾기</strong><p>위 검색창에 앱 이름, 과목, 단원, 키워드를 넣어 찾을 수 있어요.</p></div>
      <div class="guide-card"><strong>3. 개인정보</strong><p>이 사이트의 앱은 학생 개인정보를 받거나 저장하지 않아요.</p></div>
    </div>
  </section>

  <footer class="footer"><div class="wrap" id="footer"></div></footer>

  <div class="qr-modal" id="qrModal" hidden>
    <div class="qr-card" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
      <button class="qr-close" id="qrClose" type="button" aria-label="닫기">×</button>
      <h2 id="qrTitle">휴대폰으로 바로 접속</h2>
      <p>카메라 앱으로 QR 코드를 비춰 보세요.</p>
      <img src="images/qr.svg" alt="사이트 접속 QR 코드" />
      <p class="qr-url" id="qrUrl"></p>
    </div>
  </div>

  <script src="apps.js"></script>
  <script src="main.js"></script>
</body>
</html>
